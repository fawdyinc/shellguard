name: curl
description: Transfer data from or to a server (GET-only policy)
category: network
# A URL is a positional argument, and query strings legitimately contain ? and
# [ ] -- `curl http://localhost/server-status?auto` is not a failed glob.
regex_arg_position: 0
flags:
  - flag: "-I"
  - flag: "-s"
  - flag: "-S"
  - flag: "-m"
    takes_value: true
  - flag: "-k"
  - flag: "-L"
  - flag: "-v"
  - flag: "-w"
    takes_value: true
    description: "Format what is written to stdout after the transfer"
  - flag: "--write-out"
    takes_value: true
  - flag: "-X"
    deny: true
    reason: "Only GET requests are allowed"
  - flag: "--request"
    deny: true
    reason: "Only GET requests are allowed"
  - flag: "-d"
    deny: true
    reason: "Request bodies are not allowed"
  - flag: "--data"
    deny: true
    reason: "Request bodies are not allowed"
  - flag: "--data-binary"
    deny: true
    reason: "Request bodies are not allowed"
  - flag: "--data-urlencode"
    deny: true
    reason: "Request bodies are not allowed"
  - flag: "-o"
    deny: true
    reason: "Writing output to files is not allowed"
  - flag: "--output"
    deny: true
    reason: "Writing output to files is not allowed"
  - flag: "-O"
    deny: true
    reason: "Writing output to files is not allowed"
  - flag: "--remote-name"
    deny: true
    reason: "Writing output to files is not allowed"
  - flag: "-T"
    deny: true
    reason: "Uploading files is not allowed"
  - flag: "--upload-file"
    deny: true
    reason: "Uploading files is not allowed"
  # -H was briefly added and reverted: it broke TestE2E_CurlHeaderInjection, which
  # asserts that `curl -H 'Authorization: Bearer stolen' http://internal:8080/admin`
  # is refused. An arbitrary header lets an agent forge Authorization or Cookie
  # against an internal service, and no GET-only policy constrains that. Declared
  # explicitly rather than left undeclared, so the next author reads a decision
  # instead of an oversight and does not add it back.
  - flag: "-H"
    takes_value: true
    deny: true
    reason:
      "An arbitrary request header can forge Authorization or Cookie against an
      internal service, so it is refused even though the method stays GET. To find
      which vhost answers a name, read the resolved server blocks with `nginx -T` or
      `apachectl -S` and the per-vhost access log. For TLS, `openssl s_client
      -servername <name>` selects by SNI without a header. If a Host-header probe is
      genuinely needed, hand the operator the line."
  - flag: "--header"
    takes_value: true
    deny: true
    reason:
      "An arbitrary request header can forge Authorization or Cookie against an
      internal service, so it is refused even though the method stays GET. Use
      `nginx -T` / `apachectl -S` plus the per-vhost access log to settle vhost
      selection, or `openssl s_client -servername <name>` for the TLS case."
stdin: false
stdout: true
