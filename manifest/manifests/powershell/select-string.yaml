name: select-string
description: Find text in strings and files
category: text
shell: powershell
regex_arg_position: 0
flags:
  - flag: "-Pattern"
    takes_value: true
  - flag: "-Path"
    takes_value: true
  - flag: "-SimpleMatch"
  - flag: "-Context"
    takes_value: true
    description: "Lines of context around each match, e.g. -Context 2,5 (2 before, 5 after). The grep -B/-A equivalent."
stdin: true
stdout: true
