name: get-childitem
description: List directory contents
category: filesystem
shell: powershell
flags:
  - flag: "-Path"
    takes_value: true
  - flag: "-Recurse"
  - flag: "-Filter"
    takes_value: true
  - flag: "-Include"
    takes_value: true
    description: "Comma-separated patterns, e.g. 'hs_err_pid*.log','*.hprof'. Unlike -Filter, matches several patterns in one pass; combine with -Recurse."
  - flag: "-LiteralPath"
    takes_value: true
  - flag: "-Name"
allows_path_args: true
stdin: false
stdout: true
