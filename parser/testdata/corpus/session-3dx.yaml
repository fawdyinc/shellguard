# Commands from the 3dx investigation session (ses_252a83796ffedk7cXAmutOY5tq).
# Mix of commands that work today and commands that motivated this plan.
# As each workstream lands, flip `expect` on the affected entries and re-run
# to see the delta. The grouping by `reason` tag drives prioritization.
entries:
  # ---- Already works (at the PARSER layer — see note on get-psdrive) ----
  - command: "Get-Service"
    source: ses_252a83796ffedk7cXAmutOY5tq
    expect: parses
    reason: bare-get-service

  - command: "Get-Process -Name dsls"
    source: ses_252a83796ffedk7cXAmutOY5tq
    expect: parses
    reason: get-process-by-name

  # This parsed all along, but the validator rejected -PSProvider until the
  # get-psdrive manifest gained flags (it declared `flags: []`). A reminder that
  # "parses" in this file never meant "runs".
  - command: "Get-PSDrive -PSProvider FileSystem"
    source: ses_252a83796ffedk7cXAmutOY5tq
    expect: parses
    reason: get-psdrive-bare

  # ---- Workstream C: calculated property in Select-Object ----
  - command: "Get-PSDrive -PSProvider FileSystem | Select-Object Name, @{N='Used(GB)';E={[math]::Round($_.Used/1GB,2)}}"
    source: ses_252a83796ffedk7cXAmutOY5tq
    expect: parses
    reason: calculated-property-in-select

  - command: "Get-Volume | Select-Object DriveLetter, @{N='SizeGB';E={[math]::Round($_.Size/1GB,2)}}"
    source: synthetic
    expect: parses
    reason: calculated-property-in-select

  # ---- Workstream C: DQString with safe content (no $ or backtick) ----
  - command: 'Get-Content -Path "C:\DassaultSystemes\R2026x\3DSpace\logs\mxtrace.log" -Tail 50'
    source: ses_252a83796ffedk7cXAmutOY5tq
    expect: parses
    reason: double-quoted-literal-path

  - command: 'Get-ChildItem -Path "C:\Program Files\DassaultSystemes"'
    source: synthetic
    expect: parses
    reason: double-quoted-literal-path

  # ---- Formerly manifest misses (Workstream D) — now RESOLVED ----
  # These parse fine; the grammar doesn't gate on cmdlet identity. They used to
  # be rejected at the validator layer, which this parser-only corpus could not
  # see. Case-insensitive cmdlet lookup fixed them: all now pass parse AND
  # validate. Do not read the group heading as "still broken" — that staleness
  # misled a later reader. Validator-level coverage now lives in
  # validator/testdata/corpus/.
  - command: "Get-CimInstance Win32_Service"
    source: ses_252a83796ffedk7cXAmutOY5tq
    expect: parses
    reason: get-ciminstance-manifest-miss

  - command: "Get-NetFirewallRule -Enabled True"
    source: synthetic
    expect: parses
    reason: get-netfirewallrule-manifest-miss

  - command: "Get-ScheduledTask | Where-Object State -eq Ready"
    source: synthetic
    expect: parses
    reason: get-scheduledtask-manifest-miss

  - command: "Test-NetConnection -ComputerName localhost -Port 443"
    source: synthetic
    expect: parses
    reason: test-netconnection-manifest-miss

  # Fixed: IPLiteral token added ahead of Number, so all four octets lex as
  # one token instead of Number(127) plus an unlexable `.0.0.1`.
  - command: "Test-NetConnection -ComputerName 127.0.0.1 -Port 443"
    source: synthetic
    expect: parses
    reason: ip-address-literal

  - command: "Get-Process | ForEach-Object ProcessName"
    source: synthetic
    expect: parses
    reason: foreach-object-simplified-manifest-miss

  - command: "Get-Process | Group-Object -Property ProcessName -NoElement"
    source: synthetic
    expect: parses
    reason: group-object-manifest-miss

  # ---- Workstream C: compound Where-Object filter via PSSafeExpr block ----
  - command: "Get-Service | Where-Object { $_.Status -eq 'Running' -and $_.StartType -eq 'Automatic' }"
    source: synthetic
    expect: parses
    reason: compound-where-object-block

  # ---- Workstream C: env var read ($env:VARNAME) ----
  - command: "Get-ChildItem $env:USERPROFILE"
    source: synthetic
    expect: parses
    reason: env-var-read

  # ---- Deprecated cmdlet that should route to Get-CimInstance (Workstream E) ----
  - command: "Get-WmiObject Win32_OperatingSystem"
    source: synthetic
    expect: parses
    reason: deprecated-get-wmiobject
